<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechTO Event Checklist</title>
<script>window.TECHTO_SEED_URL='seed.json';</script>
<script type="module" src="firebase-adapter.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one calm sheet-like table per event, grouped by phase. The checklist belongs to the event TYPE, so every event of a type shares it.
   Spacing runs on a 4px scale; body text is 16px, table text 15px, nothing smaller than 13px. */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f4fcff; --ink:#000000; --muted:#505050; --faint:#8a8a8a;
  --line:#ececec; --line-strong:#bdbdbd;
  --accent:#ebff52; --accent-soft:#d2f5ff; --on-accent:#000000;
  --danger:#b42318; --danger-soft:#fde8e6;
  --pre:#ebff52; --pre-ink:#000000; --during:#d2f5ff; --during-ink:#000000; --post:#000000; --post-ink:#ffffff;
  --ops:#d2f5ff; --ops-ink:#000000; --mkt:#ebff52; --mkt-ink:#000000;
  --shadow:0 2px 4px rgba(0,0,0,.06),0 16px 40px rgba(0,0,0,.14);
  --font-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-display:'Bricolage Grotesque','Instrument Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0a0a0a; --surface:#141414; --surface-2:#1a1d1e; --ink:#ffffff; --muted:#b8b8b8; --faint:#828282;
    --line:#262626; --line-strong:#4d4d4d;
    --accent:#ebff52; --accent-soft:#17323b; --on-accent:#000000;
    --danger:#ff8a80; --danger-soft:#3d1f1d;
    --pre:#ebff52; --pre-ink:#000000; --during:#d2f5ff; --during-ink:#000000; --post:#ffffff; --post-ink:#000000;
    --ops:#d2f5ff; --ops-ink:#000000; --mkt:#ebff52; --mkt-ink:#000000;
    --shadow:0 2px 4px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#141414; --surface-2:#1a1d1e; --ink:#ffffff; --muted:#b8b8b8; --faint:#828282;
  --line:#262626; --line-strong:#4d4d4d;
  --accent:#ebff52; --accent-soft:#17323b; --on-accent:#000000;
  --danger:#ff8a80; --danger-soft:#3d1f1d;
  --pre:#ebff52; --pre-ink:#000000; --during:#d2f5ff; --during-ink:#000000; --post:#ffffff; --post-ink:#000000;
  --ops:#d2f5ff; --ops-ink:#000000; --mkt:#ebff52; --mkt-ink:#000000;
  --shadow:0 2px 4px rgba(0,0,0,.5),0 16px 40px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:24px 24px 72px}
h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.2;letter-spacing:-.015em;margin:0;text-wrap:balance}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}

/* controls */
.lbl{display:block;font-size:.8125rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.select,.field{width:100%;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:6px 12px;min-height:40px;font-size:.875rem}
.select{font-weight:600;appearance:auto}
textarea.field{resize:vertical;min-height:88px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:6px 14px;min-height:36px;font-size:.875rem;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--on-accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:.75rem;line-height:1.5;font-weight:600;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.type{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.ch{font-weight:500}

/* event bar */
.eventbar{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin-bottom:16px}
.eventbar .grow{flex:0 1 340px;min-width:200px}
.evmeta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;min-height:40px;color:var(--muted);font-size:.875rem}

/* summary */
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;min-height:40px}
.prog .num{font-family:var(--font-display);font-weight:700;font-size:1.125rem;font-variant-numeric:tabular-nums}
.prog .of{color:var(--muted);font-size:.8125rem}
.prog .bar{width:56px}
.pchip{border:0;background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.pchip:hover{background:var(--accent-soft)}
.bar{height:6px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .25s ease}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;min-height:32px;font-size:.8125rem;font-weight:600;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.field.search{flex:0 1 200px;max-width:200px;min-height:32px;padding:4px 12px;font-size:.8125rem;border-color:var(--line);border-radius:8px;background:transparent}
.field.search:focus{border-color:var(--line-strong)}
.count{color:var(--muted);font-size:.8125rem;margin-left:auto;font-variant-numeric:tabular-nums}

/* table */
.table{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.cols{display:grid;grid-template-columns:64px minmax(0,3fr) 124px minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1.8fr) 84px;align-items:start}
.thead{border-bottom:1px solid var(--line);font-size:.8125rem;font-weight:600;color:var(--muted)}
.thead>div{padding:10px 10px}
.metawrap{display:contents}
.band{display:flex;align-items:center;gap:10px;padding:4px 12px 4px 16px;background:var(--surface-2);border-top:1px solid var(--line);scroll-margin-top:16px}
.band:first-of-type{border-top:0}
.tag{display:inline-flex;border-radius:999px;padding:2px 10px;font-size:.6875rem;font-weight:700;letter-spacing:.06em}
.tag.pre{background:var(--pre);color:var(--pre-ink)}
.tag.during{background:var(--during);color:var(--during-ink)}
.tag.post{background:var(--post);color:var(--post-ink)}
.band .bc{color:var(--muted);font-size:.8125rem;font-variant-numeric:tabular-nums}
.band .sp{flex:1}
.band .btn{min-height:28px;padding:2px 10px;font-size:.8125rem}
.rg{border-top:1px solid var(--line)}
.rg:hover .row{background:var(--surface-2)}
.row>div,.row>.metawrap>div{padding:10px 10px;min-width:0}
.row.editing{background:var(--surface-2)}
.row.done .task{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.cell-chk{display:flex;align-items:flex-start;justify-content:flex-start;gap:6px;padding-left:4px !important;padding-top:12px !important}
.grip{flex:none;width:18px;height:20px;border:0;background:transparent;color:var(--faint);cursor:grab;padding:0;border-radius:4px;line-height:1;font-size:14px;letter-spacing:-3px;display:grid;place-items:center;touch-action:none}
.grip:hover{color:var(--ink);background:var(--accent-soft)}
.grip:active{cursor:grabbing}
.grip[disabled]{opacity:.3;cursor:not-allowed}
.dragging{opacity:.4}
.rg.drop-before{box-shadow:inset 0 3px 0 0 var(--ink)}
.rg.drop-after{box-shadow:inset 0 -3px 0 0 var(--ink)}
.band.drop-into{box-shadow:inset 0 -3px 0 0 var(--ink)}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-strong);background:var(--surface);display:inline-grid;place-items:center;padding:0;color:transparent;position:relative}
.chk::after{content:"";position:absolute;inset:-10px}
.chk:hover{border-color:var(--ink)}
.chk[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:var(--accent)}
.task{font-size:.875rem;font-weight:500;line-height:1.5;overflow-wrap:anywhere}
.dmeta{margin-top:2px;font-size:.75rem;color:var(--muted)}
.pill{display:inline-block;border-radius:6px;padding:1px 8px;line-height:1.5;font-weight:600;font-size:.75rem}
.pill.ops{background:var(--ops);color:var(--ops-ink)}
.pill.mkt{background:var(--mkt);color:var(--mkt-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.timing{font-size:.8125rem}
.acts{display:flex;gap:4px;justify-content:flex-end}
.field.inl,.select.inl{min-height:32px;padding:4px 8px;font-size:.875rem;border-radius:8px}
textarea.field.inl{min-height:52px}
.inl-gap{margin-top:6px;max-width:200px}
.row .picker .opt{min-height:28px;padding:2px 10px;font-size:.75rem}
.row .picker input{min-height:28px;width:90px;font-size:.75rem}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px 8px 58px;background:var(--accent-soft)}
.editbar .sp{flex:1}
.editbar .help{margin:0}
.cellinput{display:block;width:100%;resize:none;border:1px solid transparent;border-radius:6px;background:var(--surface);padding:2px 6px;margin:-3px -7px;width:calc(100% + 14px);font:inherit;font-size:.875rem;font-weight:500;line-height:1.5;color:var(--ink);field-sizing:content;min-height:30px;overflow:hidden}
.cellinput:hover{border-color:var(--line-strong)}
.cellinput:focus{outline:0;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.dd.bare .ddbtn{border-color:transparent;background:transparent;padding:2px 6px;margin:-3px -7px;width:calc(100% + 14px);min-height:30px}
.dd.bare .ddbtn:hover,.dd.bare .ddbtn[aria-expanded="true"]{border-color:var(--ink);background:var(--surface)}
.icon-btn.on{background:var(--accent);color:#000}
.icon-btn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.dd{position:relative}
.ddbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;min-height:32px;padding:3px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);text-align:left;font-size:.8125rem}
.ddbtn:hover,.ddbtn[aria-expanded="true"]{border-color:var(--ink)}
.ddval{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.ddph{color:var(--faint)}
.caret{color:var(--muted);font-size:.75rem;flex:none}
.ddmenu{position:absolute;z-index:15;left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:280px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto}
.ddopt{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:8px;padding:6px 8px;text-align:left;font-size:.8125rem;min-height:32px}
.ddopt:hover{background:var(--surface-2)}
.ddopt.on{background:var(--accent-soft)}
.ddopt .tick{width:14px;flex:none;font-weight:700}
.ddnew{margin-top:4px}
.notecell{display:flex;flex-direction:column;gap:2px;align-items:flex-start;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:4px 8px;margin:-4px -8px;color:var(--ink);font-size:.8125rem;line-height:1.4;min-height:32px}
.notecell:hover,.notecell[aria-expanded="true"]{background:var(--accent-soft)}
.notecell .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.notecell .nm{color:var(--muted);font-size:.75rem}
.notecell.empty{flex-direction:row;align-items:center;gap:6px;color:var(--faint);font-weight:500}
.notecell.empty:hover{color:var(--ink)}
.icon-btn{position:relative;width:36px;height:36px;margin:-4px 0;border:0;background:transparent;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--accent-soft);color:var(--ink)}
.icon-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
.icon-btn .badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:99px;background:var(--ink);color:var(--bg);font-size:.6875rem;font-weight:700;display:grid;place-items:center;padding:0 5px}
.empty-row{padding:20px;color:var(--muted);border-top:1px solid var(--line)}
.notes{background:var(--surface-2);border-top:1px dashed var(--line-strong);padding:16px 24px 20px 58px}
.notes-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:16px;max-width:720px}
.note-head{display:flex;gap:12px;align-items:baseline;font-size:.875rem}
.note-by{font-weight:700}
.note-when{color:var(--muted)}
.note-text{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9375rem}
.note-empty{color:var(--muted);font-size:.9375rem}
.link-btn{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:.875rem}
.link-btn:hover{color:var(--danger)}
.notebox{display:flex;gap:12px;align-items:flex-end;max-width:720px}
.notebox textarea{min-height:64px}
.footnote{display:flex;gap:20px;flex-wrap:wrap;align-items:center;margin-top:16px;color:var(--muted);font-size:.9375rem}
.footnote button{border:0;background:none;color:var(--ink);padding:0;font-weight:600;text-decoration:underline;font-size:.9375rem}
.panel{background:var(--surface-2);border-radius:16px;padding:28px;margin-bottom:24px}
.panel.center{text-align:center;padding:64px 24px}
.panel h2{font-family:var(--font-display);margin:0 0 8px;font-size:1.375rem}
.panel p{margin:0 auto 20px;color:var(--muted);max-width:52ch}
.banner{background:var(--danger-soft);color:var(--danger);border-radius:12px;padding:12px 16px;margin-bottom:24px;font-weight:600}

/* dialog */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto;z-index:20}
.dialog{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px;width:100%;max-width:540px}
.dialog.wide{max-width:640px}
.dialog h2{font-family:var(--font-display);font-size:1.375rem;line-height:1.2;margin:0 0 20px}
.fields{display:flex;flex-direction:column;gap:20px}
.fields.inset{padding:16px;border-radius:12px;background:var(--surface-2);gap:16px}
.help{color:var(--muted);font-size:.875rem;margin-top:8px}
.err{color:var(--danger);font-size:.875rem;font-weight:600}
.dialog-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;margin-top:28px}
.dialog-actions .left{margin-right:auto}
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:36px;font-weight:600;font-size:.875rem;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--on-accent);color:var(--on-accent)}
.picker input{width:160px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px dashed var(--line-strong);background:transparent;font-size:.875rem}
.radio{display:flex;flex-direction:column;gap:12px}
.radio label{display:flex;gap:10px;align-items:center;min-height:28px}
.radio input{width:18px;height:18px;accent-color:#000}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.restore-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.restore-list li{display:flex;gap:16px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;box-shadow:var(--shadow);z-index:30;max-width:90vw;font-weight:600}

@media (max-width:860px){
  .select,.field,.field.search,.picker input{font-size:16px}
  .field.search{flex:1 1 100%;max-width:none}
  .btn{min-height:44px}
  .wrap{padding:24px 16px 80px}
  .prog{margin-left:0;width:100%;flex-wrap:wrap}
  .thead{display:none}
  .cols{grid-template-columns:64px minmax(0,1fr) auto}
  .row>.cell-chk{grid-column:1;grid-row:1}
  .row>div[role="cell"]:nth-child(2){grid-column:2;grid-row:1}
  .row>.acts{grid-column:3;grid-row:1;padding:12px 8px}
  .row>.cell-notes{grid-column:2 / 4;grid-row:3;padding:0 12px 14px 12px}
  .notecell{margin:0}
  .row>.metawrap{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;grid-column:2 / 4;grid-row:2;padding:0 12px 16px 12px}
  .row>.metawrap>div{padding:0 !important}
  .notes{padding:16px}
  .editbar{padding-left:16px}
  .field.inl,.select.inl,.row .picker input{font-size:16px}
  .two{grid-template-columns:1fr}
  .count{margin-left:0;width:100%}
  .dialog{padding:20px}
}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>

<div class="wrap">

</div>
<div id="dialogRoot"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function(){
'use strict';

var PHASES=[
  {key:'pre',label:'Pre-event',band:'PRE-EVENT'},
  {key:'during',label:'During the event',band:'DURING THE EVENT'},
  {key:'post',label:'Post-event',band:'POST EVENT'}
];
var TEAMS=['Ops','Marketing'];
var KNOWN_CHANNELS=['Luma','Email','Beehiiv','Slack','Instagram','LinkedIn','YouTube','Canva','Mentimeter','Xero','Pixieset','PicFlow','Drive'];
var KNOWN_TIMINGS=['4+ weeks out','3-4 weeks out','1-2 weeks out','1 week out','Day before','Day of, morning','Setup (before doors)','During the event','Day after','Within 1-2 days','After the event','Monthly'];

var S={
  events:[],items:[],types:[],progress:new Map(),notes:[],loaded:{},sel:null,
  team:'all',status:'all',q:'',openNotes:new Set(),edit:null,menu:null,drag:null,drafts:{},names:{},
  me:{id:null,name:''},canWrite:true,db:null,user:null,dbMissing:false,slow:false
};

/* ---------- tiny helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function h(tag,props){
  var n=document.createElement(tag);
  if(props){
    for(var k in props){
      var v=props[k];
      if(v==null) continue;
      if(k==='class') n.className=v;
      else if(k==='text') n.textContent=v;
      else if(k.indexOf('on')===0) n.addEventListener(k.slice(2).toLowerCase(),v);
      else if(v===false) continue;
      else if(v===true) n.setAttribute(k,'');
      else n.setAttribute(k,v);
    }
  }
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    for(var j=0;j<kids.length;j++){
      var kid=kids[j];
      if(kid==null||kid===false) continue;
      n.append(kid.nodeType?kid:document.createTextNode(String(kid)));
    }
  }
  return n;
}
var ICONS={
  chat:'<path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  pencil:'<path d="M4 20l1-4L16 5l3 3L8 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  plus:'<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'
};
function icon(name,size){

    var commit=function(f,v){delete D[f]; var cur=it[f]; var same=JSON.stringify(cur)===JSON.stringify(v)||(f==='task'&&!v); if(same){schedule();return;}
      var doc=Object.assign({},it); delete doc.id; doc[f]=v; writeItem(it.id,doc);};
    var ta=h('textarea',{class:'cellinput',rows:1,'aria-label':'Task detail','data-fk':'e-task',
      onInput:function(e){D.task=e.target.value;},
      onBlur:function(e){if('task' in D) commit('task',(D.task||'').trim());},
      onKeydown:function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.blur();} else if(e.key==='Escape'){delete D.task;schedule();}}}); ta.value=val('task')||'';
    var tm=dd('team',{bare:true,label:'Team',display:[teamNode(it.team||'Ops')],options:TEAMS.map(function(t){return {value:t,node:teamNode(t)};}),selected:[it.team],onChange:function(v){commit('team',v[0]);}});
    var ti=dd('timing',{bare:true,label:'Timing',placeholder:'Timing',display:it.timing?[h('span',{text:it.timing})]:[],options:knownTimings().map(function(t){return {value:t,label:t};}),selected:[it.timing],allowNew:'Type a custom timing, press Enter',onChange:function(v){commit('timing',(v[0]||'').trim());}});
    var pk=dd('channel',{bare:true,label:'Channels',multi:true,placeholder:'Channels',display:(it.channel||[]).map(function(c){return h('span',{class:'chip ch',text:c});}),options:knownChannels().map(function(c){return {value:c,node:h('span',{class:'chip ch',text:c})};}),selected:it.channel||[],allowNew:'Add a channel, press Enter',onChange:function(v){commit('channel',v);}});
    taskCell=h('div',{role:'cell'},ta);
    team=h('div',{role:'cell'},tm);
    timing=h('div',{role:'cell'},ti);
    chans=h('div',{role:'cell'},pk);
    ebtn=[h('button',{type:'button',class:'icon-btn on','aria-label':'Finish editing',onClick:function(){S.edit=null;S.menu=null;schedule();}},icon('check',18)),
          h('button',{type:'button',class:'icon-btn danger','aria-label':'Remove: '+it.task,onClick:function(){openRemoveDialog(it);}},icon('trash',18))];
  }
  var row=h('div',{class:'cols row'+(done?' done':'')+(editing?' editing':''),role:'row'},
    h('div',{class:'cell-chk',role:'cell'},grip,chk),taskCell,h('div',{class:'metawrap'},team,timing,chans),notecell,h('div',{class:'acts',role:'cell'},ebtn));
  var g=h('div',{class:'rg',role:'rowgroup','data-id':it.id,
    onDragover:function(e){if(!S.drag||S.drag===it.id)return;e.preventDefault();e.dataTransfer.dropEffect='move';
      var r=row.getBoundingClientRect(), after=e.clientY>r.top+r.height/2; clearDrop(); var dg=document.querySelector('.rg[data-id="'+S.drag+'"]'); if(dg) dg.classList.add('dragging'); g.classList.add(after?'drop-after':'drop-before');},
    onDrop:function(e){if(!S.drag||S.drag===it.id)return;e.preventDefault();var r=row.getBoundingClientRect(), after=e.clientY>r.top+r.height/2; var id=S.drag; S.drag=null; clearDrop(); moveItem(ev,id,it.id,after?'after':'before');}},row);
  if(open) g.append(buildNotes(ev,it,notes,key));
  return g;
}

function buildNotes(ev,it,notes,key){
  var list=h('ul',{class:'notes-list'});
  notes.forEach(function(n){
    list.append(h('li',{class:'note'},
      h('div',{class:'note-head'},h('span',{class:'note-by',text:nameOf(n.by)}),h('span',{class:'note-when',text:ago(n.at)}),
        (S.canWrite&&n.by&&n.by===S.me.id)?h('button',{type:'button',class:'link-btn',onClick:function(){deleteNote(n);}},'Delete'):null),
      h('p',{class:'note-text',text:n.text})));
  });
  if(!notes.length) list.append(h('li',{class:'note-empty',text:'No notes yet. Leave one for the team.'}));
  var ta=h('textarea',{class:'field',rows:2,placeholder:'Leave a note for the team…','aria-label':'New note','data-fk':'note:'+key,disabled:!S.canWrite,
    onInput:function(e){S.drafts[key]=e.target.value;},
    onKeydown:function(e){if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){e.preventDefault();post();}}});
  ta.value=S.drafts[key]||'';
  function post(){
    var t=(S.drafts[key]||'').trim(); if(!t) return;
    addNote(ev,it,t).then(function(ok){if(ok){S.drafts[key]='';schedule();}});
  }
  return h('div',{class:'notes'},list,h('div',{class:'notebox'},ta,h('button',{type:'button',class:'btn primary',disabled:!S.canWrite,onClick:post},'Post note')));
}

/* ---------- dialogs ---------- */
function modal(title,body,actions,wide){
  var root=$('#dialogRoot'), opener=document.activeElement;
  function close(){root.replaceChildren();document.removeEventListener('keydown',onKey);if(opener&&opener.focus){try{opener.focus();}catch(e){}}}
  function onKey(e){if(e.key==='Escape'){e.preventDefault();close();}}
  var dlg=h('div',{class:'dialog'+(wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':title},h('h2',{text:title}),body,h('div',{class:'dialog-actions'},actions(close)));
  var back=h('div',{class:'backdrop',onMousedown:function(e){if(e.target===back)close();}},dlg);
  root.replaceChildren(back); document.addEventListener('keydown',onKey);
  var first=dlg.querySelector('input,textarea,select'); if(first) first.focus();
  return close;
}
function field(label,id,control,help){
  return h('div',null,h('label',{class:'lbl','for':id,text:label}),control,help?h('div',{class:'help',text:help}):null);
}
function picker(options,selected,placeholder,ariaLabel,onChange){
  var sel=new Set(selected), opts=options.slice();
  selected.forEach(function(s){if(opts.indexOf(s)<0) opts.push(s);});
  var box=h('div',{class:'picker',role:'group','aria-label':ariaLabel});
  var input=h('input',{type:'text',placeholder:placeholder,'aria-label':'Add '+ariaLabel,onKeydown:function(e){
    if(e.key==='Enter'){e.preventDefault();var v=input.value.trim(); if(!v) return; if(opts.indexOf(v)<0) opts.push(v); sel.add(v); input.value=''; changed(); paint(); input.focus();}
  }});
  function changed(){if(onChange) onChange(opts.filter(function(o){return sel.has(o);}));}
  function paint(){
    box.replaceChildren.apply(box,opts.map(function(o){
      return h('button',{type:'button',class:'opt','aria-pressed':String(sel.has(o)),text:o,onClick:function(){if(sel.has(o)) sel.delete(o); else sel.add(o); changed(); paint();}});
    }).concat([input]));
  }
  paint();
  return {node:box,get:function(){return opts.filter(function(o){return sel.has(o);});}};
}

function openEventDialog(ev){
  var editing=!!ev, types=userTypes(), cur=currentEvent(), starter=starterType();
  var name=h('input',{id:'e-name',class:'field',type:'text',placeholder:'e.g. December founders night',value:editing?ev.name:''});
  var date=h('input',{id:'e-date',class:'field',type:'date',value:editing?(ev.date||''):''});
  var typeSel=h('select',{id:'e-type',class:'select'},types.map(function(t){return h('option',{value:t.id,text:t.name});}),h('option',{value:'__new',text:'New event type…'}));
  var startId=editing?ev.typeId:(cur?cur.typeId:'');
  typeSel.value=types.some(function(t){return t.id===startId;})?startId:(types[0]?types[0].id:'__new');
  var newName=h('input',{id:'e-newtype',class:'field',type:'text',placeholder:'e.g. Monthly founders night'});
  var copySel=h('select',{id:'e-copy',class:'select'},
    starter?h('option',{value:starter.id,text:'Starter checklist'}):null,
    types.map(function(t){return h('option',{value:t.id,text:'Copy of '+t.name});}),
    h('option',{value:'',text:'Empty checklist'}));
  if(starter) copySel.value=starter.id; else if(types[0]) copySel.value=types[0].id;
  var newBox=h('div',{class:'fields inset'},
    field('New event type','e-newtype',newName),
    field('Start its checklist from','e-copy',copySel,'The new type gets its own copy, so editing it won’t change other types.'));
  function sync(){newBox.hidden=typeSel.value!=='__new';}
  typeSel.addEventListener('change',sync); sync();
  var err=h('div',{class:'err',role:'alert'});
  var body=h('div',{class:'fields'},
    field('Event name','e-name',name),
    h('div',{class:'two'},field('Date','e-date',date),
      field('Event type','e-type',typeSel)),
    newBox,
    h('div',{class:'help',text:'Every event of the same type shares one checklist. Add or remove a task once and it changes for all of them. Ticks and notes stay with each event.'}),err);
  modal(editing?'Edit event':'New event',body,function(close){
    var out=[];
    if(editing) out.push(h('button',{type:'button',class:'btn left',onClick:function(){
      writeEvent(ev.id,Object.assign({},ev,{archived:!ev.archived})).then(function(ok){if(ok) close();});}},ev.archived?'Restore event':'Archive event'));
    out.push(h('button',{type:'button',class:'btn',onClick:close},'Cancel'));
    var saveBtn=h('button',{type:'button',class:'btn primary'},editing?'Save':'Create event');
    saveBtn.addEventListener('click',async function(){
      err.textContent='';
      var n=name.value.trim(); if(!n){err.textContent='Give the event a name.';name.focus();return;}
      var typeId=typeSel.value, isNew=typeId==='__new', tn='';
      if(isNew){
        tn=newName.value.trim();
        if(!tn){err.textContent='Name the new event type.';newName.focus();return;}
        if(types.some(function(t){return (t.name||'').toLowerCase()===tn.toLowerCase();})){err.textContent='That event type already exists. Pick it from the list.';return;}
      }
      saveBtn.disabled=true; var label=saveBtn.textContent;
      if(isNew){
        typeId=uid('ty');
        var ok=await writeType(typeId,{name:tn,createdAt:Date.now()});
        if(!ok){saveBtn.disabled=false;return;}
        if(copySel.value){
          saveBtn.textContent='Copying checklist…';
          var okc=await copyChecklist(copySel.value,typeId,function(i,t){saveBtn.textContent='Copying '+i+' of '+t+'…';});
          if(!okc){saveBtn.disabled=false;saveBtn.textContent=label;return;}
        }
      }
      var id=editing?ev.id:uid('ev');
      var doc=editing?Object.assign({},ev):{createdBy:S.me.id,createdAt:Date.now(),archived:false};
      delete doc.id; delete doc.type; doc.name=n; doc.date=date.value||''; doc.typeId=typeId;
      var ok2=await writeEvent(id,doc);
      if(ok2){close(); if(!editing) chooseEvent(id);} else {saveBtn.disabled=false;saveBtn.textContent=label;}
    });
    out.push(saveBtn);
    return out;
  });
}

function openItemDialog(opts){
  var ev=currentEvent(), item=opts.item||null, editing=!!item, tn=ev?typeName(ev.typeId):'';
  var task=h('textarea',{id:'i-task',class:'field',rows:3,placeholder:'What needs to happen?'}); task.value=item?item.task:'';
  var phase=h('select',{id:'i-phase',class:'select'},PHASES.map(function(p){return h('option',{value:p.key,text:p.label});})); phase.value=item?(item.phase||'pre'):(opts.phase||'pre');
  var team=h('select',{id:'i-team',class:'select'},TEAMS.map(function(t){return h('option',{value:t,text:t});})); team.value=item?item.team:'Ops';
  var timing=h('input',{id:'i-timing',class:'field',type:'text',list:'timingList',placeholder:'e.g. 1-2 weeks out',value:item?(item.timing||''):''});
  var tl=h('datalist',{id:'timingList'},knownTimings().map(function(t){return h('option',{value:t});}));
  var chans=picker(knownChannels(),item?(item.channel||[]):[],'Add channel','channels');
  var scope='all';
  var err=h('div',{class:'err',role:'alert'});
  var kids=[
    field('Task detail','i-task',task),
    h('div',{class:'two'},field('Section','i-phase',phase),field('Team','i-team',team)),
    field('Timing','i-timing',timing),
    h('div',null,h('span',{class:'lbl',text:'Channel'}),chans.node)
  ];
  if(!editing&&ev){
    var r1=h('input',{type:'radio',name:'scope',id:'sc-all',checked:true,onChange:function(){scope='all';}});
    var r2=h('input',{type:'radio',name:'scope',id:'sc-ev',onChange:function(){scope='event';}});
    kids.push(h('div',null,h('span',{class:'lbl',text:'Add to'}),h('div',{class:'radio'},
      h('label',null,r1,'Every '+(tn||'')+' event'),h('label',null,r2,'Only '+ev.name))));
  } else if(editing&&item.eventId){
    kids.push(h('div',{class:'help',text:'This task only appears in this event.'}));
  } else if(editing){
    kids.push(h('div',{class:'help',text:'Changes apply to every '+(tn||'')+' event. Ticks and notes stay with each event.'}));
  }
  kids.push(err,tl);
  modal(editing?'Edit item':'Add item',h('div',{class:'fields'},kids),function(close){
    var out=[];
    if(editing) out.push(h('button',{type:'button',class:'btn danger left',onClick:function(){close();openRemoveDialog(item);}},'Remove…'));
    out.push(h('button',{type:'button',class:'btn',onClick:close},'Cancel'));
    out.push(h('button',{type:'button',class:'btn primary',onClick:function(){
      var t=task.value.trim(); if(!t){err.textContent='Describe the task.';task.focus();return;}
      var ph=phase.value, id=editing?item.id:uid('t'), typeId=editing?item.typeId:(ev?ev.typeId:null);
      var order;
      if(editing&&(item.phase||'pre')===ph) order=item.order||0;
      else{var mx=0; S.items.forEach(function(i){if(i.typeId===typeId&&(i.phase||'pre')===ph&&(i.order||0)>mx) mx=i.order||0;}); order=mx+10;}
      var doc={task:t,team:team.value,phase:ph,timing:timing.value.trim(),channel:chans.get(),typeId:typeId,
        eventId:editing?(item.eventId||null):(scope==='event'&&ev?ev.id:null),order:order};
      writeItem(id,doc).then(function(ok){if(ok) close();});
    }},editing?'Save':'Add item'));
    return out;
  },true);
}

function openRemoveDialog(item){
  var ev=currentEvent(), tn=ev?typeName(ev.typeId):'';
  var only=!!item.eventId;
  var body=h('div',null,h('p',{text:'“'+item.task+'”'}),
    h('p',{class:'help',text:only?'This task only exists in this event.':'Remove it from just this event, or from every '+(tn||'')+' event. Items removed from one event can be restored.'}));
  modal(only?'Delete item?':'Remove item?',body,function(close){
    var out=[h('button',{type:'button',class:'btn',onClick:close},'Cancel')];
    if(only){
      out.push(h('button',{type:'button',class:'btn danger',onClick:function(){deleteItem(item.id).then(function(ok){if(ok) close();});}},'Delete item'));
    }else{
      out.push(h('button',{type:'button',class:'btn danger',onClick:function(){deleteItem(item.id).then(function(ok){if(ok) close();});}},'Remove from all '+(tn||'')+' events'));
      if(ev) out.push(h('button',{type:'button',class:'btn primary',onClick:function(){writeProgress(ev,item,{hidden:true}).then(function(ok){if(ok) close();});}},'Remove from this event'));
    }
    return out;
  });
}

function openRestoreDialog(ev){
  var items=itemsForEvent(ev).filter(function(it){var p=prog(ev,it);return p&&p.hidden;});
  var list=h('ul',{class:'restore-list'},items.map(function(it){
    return h('li',null,h('span',{text:it.task}),h('button',{type:'button',class:'btn',onClick:function(e){
      var b=e.currentTarget; b.disabled=true; writeProgress(ev,it,{hidden:false}).then(function(ok){if(ok){var li=b.closest('li'); if(li) li.remove();} else b.disabled=false;});}},'Restore'));
  }));
  if(!items.length) list.append(h('li',null,'Nothing removed from this event.'));
  modal('Removed from '+ev.name,list,function(close){return [h('button',{type:'button',class:'btn primary',onClick:close},'Done')];},true);
}

/* ---------- boot ---------- */
function snapDocs(snap){return snap.docs.map(function(d){var o=Object.assign({},d.data()||{}); o.id=d.id; return o;});}
function collectNames(){
  var ids={}; S.progress.forEach(function(p){if(p.doneBy) ids[p.doneBy]=1;}); S.notes.forEach(function(n){if(n.by) ids[n.by]=1;});
  var need=Object.keys(ids).filter(function(i){return i!==S.me.id&&!(i in S.names);});
  if(!need.length||!S.user) return;
  S.user.profiles(need).then(function(ps){
    need.forEach(function(id){S.names[id]=(ps[id]&&ps[id].name)||'';});
    schedule();
  },function(){});
}
async function boot(){
  render();
  if(document.readyState!=='complete') await new Promise(function(r){window.addEventListener('load',r);});
  document.addEventListener('click',function(){if(S.menu){S.menu=null;schedule();}});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.menu){S.menu=null;schedule();}});
  window.addEventListener('hashchange',function(){
    var m=/^#e-(.+)$/.exec(location.hash||''); if(m&&m[1]!==S.sel&&S.events.some(function(e){return e.id===m[1];})){S.sel=m[1];schedule();}
  });
  var claude=window.claude, db=null, user=null;
  try{db=claude&&claude.use?await claude.use('db'):null;}catch(e){db=null;}
  try{user=claude&&claude.use?await claude.use('user'):null;}catch(e){user=null;}
  if(!db){S.dbMissing=true;render();return;}
  S.db=db; S.user=user;
  if(user){
    try{var me=await user.me(); S.me={id:me.id,name:me.name||''};}catch(e){}
    try{var cw=await user.can('data.write'); if(cw===false) S.canWrite=false;}catch(e){}
  }
  var timer=setTimeout(function(){S.slow=true;schedule();},10000);
  function sub(name,apply){
    db.collection(name).onSnapshot(function(snap){
      apply(snapDocs(snap)); S.loaded[name]=true;
      if(allLoaded()) clearTimeout(timer);
      if(name==='progress'||name==='notes') collectNames();
      schedule();
    },function(err){console.error(name,err); S.slow=true; schedule();});
  }
  sub('events',function(d){S.events=d;});
  sub('items',function(d){S.items=d;});
  sub('types',function(d){S.types=d;});
  sub('progress',function(d){S.progress=new Map(d.map(function(p){return [p.id,p];}));});
  sub('notes',function(d){S.notes=d;});
}
boot();
})();
